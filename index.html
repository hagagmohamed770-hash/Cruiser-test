<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العقارات</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.8.0/dist/sql-wasm.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>نظام إدارة العقارات</h1>
            <div class="tools">
                <select id="themeSel">
                    <option value="dark">داكن</option>
                    <option value="light">فاتح</option>
                </select>
                <select id="fontSel">
                    <option value="14">صغير</option>
                    <option value="16">متوسط</option>
                    <option value="18">كبير</option>
                </select>
                <button id="lockBtn">قفل</button>
                <button id="undoBtn" disabled>تراجع</button>
                <button id="redoBtn" disabled>إعادة</button>
            </div>
        </header>
        
        <nav id="tabs"></nav>
        
        <main id="view">
            <!-- Content will be loaded here -->
        </main>
    </div>
    
    <script src="db.js"></script>
    <script src="app.js"></script>
</body>
</html>
